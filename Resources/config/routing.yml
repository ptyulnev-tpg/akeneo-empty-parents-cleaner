# Frontend-Seite (wird vom JS-Router über pim/controller-registry gerendert)
acme_empty_product_models_index:
    path: /acme/empty-product-models

acme_empty_product_models_rest_list:
    path: /acme/rest/empty-product-models
    defaults: { _controller: acme_product_cleanup.controller.empty_product_models:listAction, _format: json }
    methods: [GET]

acme_empty_product_models_rest_delete:
    path: /acme/rest/empty-product-models/delete
    defaults: { _controller: acme_product_cleanup.controller.empty_product_models:launchDeleteAction, _format: json }
    methods: [POST]

acme_products_without_family_index:
    path: /acme/products-without-family

acme_products_without_family_rest_list:
    path: /acme/rest/products-without-family
    defaults: { _controller: acme_product_cleanup.controller.products_without_family:listAction, _format: json }
    methods: [GET]

acme_products_without_family_rest_delete:
    path: /acme/rest/products-without-family/delete
    defaults: { _controller: acme_product_cleanup.controller.products_without_family:launchDeleteAction, _format: json }
    methods: [POST]

acme_deletion_log_index:
    path: /acme/deletion-log

acme_deletion_log_rest_list:
    path: /acme/rest/deletion-log
    defaults: { _controller: acme_product_cleanup.controller.deletion_log:listAction, _format: json }
    methods: [GET]
