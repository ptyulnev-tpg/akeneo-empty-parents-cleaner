services:
    Acme\Bundle\ProductCleanupBundle\Service\EmptyProductModelCleaner:
        arguments:
            - '@database_connection'
            - '@pim_catalog.repository.product_model'
            - '@pim_catalog.remover.product_model'
            - '@pim_connector.doctrine.cache_clearer'

    Acme\Bundle\ProductCleanupBundle\Command\DeleteEmptyProductModelsCommand:
        arguments:
            - '@Acme\Bundle\ProductCleanupBundle\Service\EmptyProductModelCleaner'
        tags:
            - { name: 'console.command' }

    Acme\Bundle\ProductCleanupBundle\Widget\EmptyProductModelsWidget:
        arguments:
            - '@Acme\Bundle\ProductCleanupBundle\Service\EmptyProductModelCleaner'
        tags:
            - { name: 'pim_dashboard.widget', position: 40 }

    acme_product_cleanup.controller.empty_product_models:
        class: 'Acme\Bundle\ProductCleanupBundle\Controller\EmptyProductModelsController'
        public: true
        arguments:
            - '@Acme\Bundle\ProductCleanupBundle\Service\EmptyProductModelCleaner'
            - '@pim_user.context.user'
            - '@oro_security.security_facade'
            - '@security.token_storage'
            - '@akeneo_batch.job.job_instance_repository'
            - '@akeneo_batch_queue.launcher.queue_job_launcher'
            - '%acme_product_cleanup.job_name%'

    # --- Produkte ohne Familie + Lösch-Log ---
    Acme\Bundle\ProductCleanupBundle\Service\DeletionLog:
        arguments:
            - '@database_connection'

    Acme\Bundle\ProductCleanupBundle\Service\ProductsWithoutFamilyCleaner:
        arguments:
            - '@database_connection'
            - '@pim_catalog.repository.product'
            - '@pim_catalog.remover.product'
            - '@pim_connector.doctrine.cache_clearer'

    Acme\Bundle\ProductCleanupBundle\EventSubscriber\LogDeletionSubscriber:
        arguments:
            - '@Acme\Bundle\ProductCleanupBundle\Service\DeletionLog'
            - '@security.token_storage'
            - '@request_stack'
            - '@logger'
        tags:
            - { name: 'kernel.event_subscriber' }

    Acme\Bundle\ProductCleanupBundle\Command\DeleteProductsWithoutFamilyCommand:
        arguments:
            - '@Acme\Bundle\ProductCleanupBundle\Service\ProductsWithoutFamilyCleaner'
        tags:
            - { name: 'console.command' }

    acme_product_cleanup.controller.products_without_family:
        class: 'Acme\Bundle\ProductCleanupBundle\Controller\ProductsWithoutFamilyController'
        public: true
        arguments:
            - '@Acme\Bundle\ProductCleanupBundle\Service\ProductsWithoutFamilyCleaner'
            - '@oro_security.security_facade'
            - '@security.token_storage'
            - '@akeneo_batch.job.job_instance_repository'
            - '@akeneo_batch_queue.launcher.queue_job_launcher'
            - '%acme_product_cleanup.products_without_family_job_name%'

    acme_product_cleanup.controller.deletion_log:
        class: 'Acme\Bundle\ProductCleanupBundle\Controller\DeletionLogController'
        public: true
        arguments:
            - '@Acme\Bundle\ProductCleanupBundle\Service\DeletionLog'
            - '@oro_security.security_facade'
